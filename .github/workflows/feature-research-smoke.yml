name: Feature research smoke

on:
  workflow_dispatch:
    inputs:
      target_horizon_days:
        description: Development-only target horizon
        required: true
        default: "20"
        type: choice
        options: ["5", "10", "20", "60"]

permissions:
  contents: read

concurrency:
  group: feature-research-smoke
  cancel-in-progress: true

jobs:
  audit:
    name: Fast development-only feature evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install --editable .
      - name: Download verified private snapshot
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://${R2_BUCKET_NAME}/processed/latest-run-id.txt" latest-run-id.txt --endpoint-url "$endpoint" --only-show-errors
          run_id="$(cat latest-run-id.txt)"
          [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p data/processed
          aws s3 sync "s3://${R2_BUCKET_NAME}/processed/runs/${run_id}/" data/processed/ --endpoint-url "$endpoint" --only-show-errors
          python -m scripts.data_manifest verify
          python -m scripts.verify_data_quality_report
      - name: Build sampled development evidence
        shell: bash
        env:
          HORIZON: ${{ inputs.target_horizon_days }}
        run: |
          build-features
          python -m scripts.build_forward_return_labels --horizon "$HORIZON"
          python -m scripts.augment_research_targets --target-horizon-days "$HORIZON"
          python -m scripts.build_walk_forward_splits --target-horizon-days "$HORIZON" --universe-membership data/processed/universe_membership.parquet --purge-days "$HORIZON" --embargo-days "$HORIZON" --train-window-days 252 --validation-window-days 42 --step-days 126
          python -m scripts.audit_feature_quality --target-horizon-days "$HORIZON" --max-rows-per-date 64 --membership data/processed/universe_membership.parquet --output-dir reports/feature_research_smoke
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/feature_research_smoke/manifest.json")
          manifest = json.loads(path.read_text())
          manifest["locked_test_accessed"] = False
          manifest["research_tier"] = "smoke"
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v6
        with:
          name: feature-research-evidence-${{ github.run_id }}
          path: reports/feature_research_smoke/
          retention-days: 14
