name: Replay portfolio report

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful weekly retraining run ID containing predictions
        required: true
        type: string
      target_horizon_days:
        description: Forward-return and rebalance horizon
        required: true
        default: "10"
        type: choice
        options: ["5", "10", "20", "60"]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --editable .

      - name: Download private prediction tables
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid run ID::source_run_id must contain digits only."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p replay/classical_full replay/qml_tuned_full
          for relative_path in \
            classical_full/predictions.parquet \
            qml_tuned_full/predictions.parquet \
            qml_tuned_full/resource_usage.parquet; do
            aws s3 cp \
              "s3://${R2_BUCKET_NAME}/reports/runs/${SOURCE_RUN_ID}/${relative_path}" \
              "replay/${relative_path}" \
              --endpoint-url "$endpoint" \
              --only-show-errors
          done

      - name: Replay corrected aggregate comparison
        run: >-
          python -m scripts.build_definitive_qml_comparison
          --equal-dir replay/qml_tuned_full
          --best-classical-dir replay/classical_full
          --best-qml-dir replay/qml_tuned_full
          --target-horizon-days "${{ inputs.target_horizon_days }}"
          --private-output replay/aggregate
          --public-output replay/public

      - name: Render allowlisted replay report
        run: >-
          python -m scripts.render_private_aggregate_report
          --input-dir replay/aggregate
          --output replay-report.md

      - name: Publish safe summary
        shell: bash
        run: cat replay-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe report
        uses: actions/upload-artifact@v6
        with:
          name: corrected-portfolio-report-${{ inputs.source_run_id }}
          path: replay-report.md
          if-no-files-found: error
          retention-days: 30
