name: Nightly data refresh

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC is after the US equity market close in both EST and EDT.
    - cron: "0 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nightly-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Alpaca and macro data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install --editable .

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          [[ -z "$ALPACA_API_KEY" ]] && missing+=(ALPACA_API_KEY)
          [[ -z "$ALPACA_SECRET_KEY" ]] && missing+=(ALPACA_SECRET_KEY)
          [[ -z "$BLS_API_KEY" ]] && missing+=(BLS_API_KEY)
          if (( ${#missing[@]} )); then
            echo "::error title=Missing GitHub Secrets::Configure: ${missing[*]}"
            exit 1
          fi

      - name: Pull latest Alpaca prices
        run: python -m scripts.ingest_alpaca_prices

      - name: Pull latest macro data
        run: python -m scripts.pull_macro --config configs/data_sources.yaml

      - name: Build market-aligned macro data
        run: >-
          python -m scripts.build_macro_daily
          --prices data/processed/prices.parquet

      - name: Summarize refresh failure
        if: failure()
        run: |
          echo "::error title=Nightly data refresh failed::Review the first failed step above. API availability, credentials, and source responses are the most likely causes."

      - name: Upload refreshed data
        uses: actions/upload-artifact@v4
        with:
          name: nightly-market-data-${{ github.run_id }}
          path: |
            data/raw/
            data/processed/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
