name: Nightly data refresh

on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC is after the US equity market close in both EST and EDT.
    - cron: "0 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nightly-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh market, macro, and SEC data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install --editable .

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          [[ -z "$ALPACA_API_KEY" ]] && missing+=(ALPACA_API_KEY)
          [[ -z "$ALPACA_SECRET_KEY" ]] && missing+=(ALPACA_SECRET_KEY)
          [[ -z "$BLS_API_KEY" ]] && missing+=(BLS_API_KEY)
          [[ -z "$SEC_USER_AGENT" ]] && missing+=(SEC_USER_AGENT)
          [[ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ]] && missing+=(R2_ACCESS_KEY_ID)
          [[ -z "${{ secrets.R2_SECRET_ACCESS_KEY }}" ]] && missing+=(R2_SECRET_ACCESS_KEY)
          [[ -z "${{ secrets.R2_ACCOUNT_ID }}" ]] && missing+=(R2_ACCOUNT_ID)
          [[ -z "${{ secrets.R2_BUCKET_NAME }}" ]] && missing+=(R2_BUCKET_NAME)
          if (( ${#missing[@]} )); then
            echo "::error title=Missing GitHub Secrets::Configure: ${missing[*]}"
            exit 1
          fi

      - name: Pull latest Alpaca prices
        run: python -m scripts.ingest_alpaca_prices

      - name: Pull latest macro data
        run: >-
          python -m scripts.pull_macro
          --config configs/data_sources.yaml
          --start-year 2020

      - name: Build market-aligned macro data
        run: >-
          python -m scripts.build_macro_daily
          --prices data/processed/prices.parquet

      - name: Refresh SEC ticker and CIK lookup
        run: python -m scripts.build_sec_ticker_cik_lookup

      - name: Pull latest SEC submissions
        run: python -m scripts.ingest_sec_submissions

      - name: Pull latest SEC company facts
        run: python -m scripts.ingest_sec_company_facts

      - name: Create processed-data manifest
        run: python -m scripts.data_manifest create

      - name: Upload private R2 snapshot
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="s3://${R2_BUCKET_NAME}/processed/runs/${GITHUB_RUN_ID}/"
          aws s3 sync data/processed/ "$prefix" \
            --endpoint-url "$endpoint" \
            --only-show-errors
          printf '%s' "$GITHUB_RUN_ID" > latest-run-id.txt
          aws s3 cp latest-run-id.txt \
            "s3://${R2_BUCKET_NAME}/processed/latest-run-id.txt" \
            --endpoint-url "$endpoint" \
            --only-show-errors
          echo "Uploaded private processed-data snapshot for run $GITHUB_RUN_ID."

      - name: Summarize refresh failure
        if: failure()
        run: |
          echo "::error title=Nightly data refresh failed::Review the first failed step above. API availability, credentials, SEC identity, and source responses are the most likely causes."
