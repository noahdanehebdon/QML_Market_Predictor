name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Build and verify wheel
        shell: bash
        run: |
          python -m build
          python -m twine check dist/*
          python -m scripts.verify_wheel_install dist/*.whl

      - name: Type check selected modules
        run: >-
          python -m mypy
          src/market_qml/cli.py
          scripts/check_git_data_policy.py
          scripts/verify_wheel_install.py

      - name: Audit declared dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit . --strict

      - name: Check tracked data policy
        run: python -m scripts.check_git_data_policy

      - name: Test with coverage
        shell: bash
        run: |
          python -m pytest -q \
            --cov=market_qml \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:coverage.json \
            --cov-fail-under=82
          {
            echo "## Python ${{ matrix.python-version }} coverage"
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
