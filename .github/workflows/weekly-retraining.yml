name: Weekly model retraining

on:
  workflow_dispatch:
    inputs:
      baseline_model:
        description: Classical baseline to retrain
        required: true
        default: tuned_gradient_boosting_regressor
        type: choice
        options:
          - tuned_gradient_boosting_regressor
          - gradient_boosting_regressor
          - logistic_regression
      run_qml:
        description: Also run the VQC model (slower)
        required: true
        default: false
        type: boolean
      classical_sweep:
        description: Run all classical development candidates and controls (no QML)
        required: true
        default: false
        type: boolean
      leakage_stress_test:
        description: Lag signals and use shorter folds plus block-aware inference
        required: true
        default: false
        type: boolean
      phase2_evaluation:
        description: Run the frozen Phase 2 development-only candidate contract
        required: true
        default: false
        type: boolean
      full_experiment:
        description: Run every classical model plus nested-tuned QML comparison
        required: true
        default: false
        type: boolean
      quantum_sample_rows:
        description: Train and validation rows per split for full QML experiment
        required: true
        default: "512"
        type: string
      quantum_iterations:
        description: VQC and QCNN iterations for tuning and final fits
        required: true
        default: "30"
        type: string
      target_horizon_days:
        description: Development-selected classification horizon
        required: true
        default: "20"
        type: choice
        options: ["5", "10", "20", "60"]
  schedule:
    # Saturday morning, after the final weekday data refresh has completed.
    - cron: "0 8 * * 6"

permissions:
  contents: read

concurrency:
  group: weekly-model-retraining
  cancel-in-progress: false

jobs:
  retrain:
    name: Build features and retrain models
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASELINE_MODEL: ${{ inputs.baseline_model || 'tuned_gradient_boosting_regressor' }}
      RUN_QML: ${{ inputs.run_qml || 'false' }}
      CLASSICAL_SWEEP: ${{ inputs.classical_sweep || 'false' }}
      LEAKAGE_STRESS_TEST: ${{ inputs.leakage_stress_test || 'false' }}
      PHASE2_EVALUATION: ${{ inputs.phase2_evaluation || 'false' }}
      FULL_EXPERIMENT: ${{ inputs.full_experiment || 'false' }}
      QUANTUM_SAMPLE_ROWS: ${{ inputs.quantum_sample_rows || '512' }}
      QUANTUM_ITERATIONS: ${{ inputs.quantum_iterations || '30' }}
      TARGET_HORIZON_DAYS: ${{ inputs.target_horizon_days || '20' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install --editable .

      - name: Download latest private R2 snapshot
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          missing=()
          [[ -z "$AWS_ACCESS_KEY_ID" ]] && missing+=(R2_ACCESS_KEY_ID)
          [[ -z "$AWS_SECRET_ACCESS_KEY" ]] && missing+=(R2_SECRET_ACCESS_KEY)
          [[ -z "$R2_ACCOUNT_ID" ]] && missing+=(R2_ACCOUNT_ID)
          [[ -z "$R2_BUCKET_NAME" ]] && missing+=(R2_BUCKET_NAME)
          if (( ${#missing[@]} )); then
            echo "::error title=Missing R2 secrets::Configure: ${missing[*]}"
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp \
            "s3://${R2_BUCKET_NAME}/processed/latest-run-id.txt" \
            latest-run-id.txt \
            --endpoint-url "$endpoint" \
            --only-show-errors
          run_id="$(cat latest-run-id.txt)"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid R2 snapshot pointer::The latest run ID is missing or invalid."
            exit 1
          fi
          mkdir -p data/processed
          aws s3 sync \
            "s3://${R2_BUCKET_NAME}/processed/runs/${run_id}/" \
            data/processed/ \
            --endpoint-url "$endpoint" \
            --only-show-errors
          python -m scripts.data_manifest verify
          python -m scripts.verify_data_quality_report
          echo "Using verified private R2 snapshot from run $run_id."

      - name: Build features and walk-forward splits
        run: build-features

      - name: Align labels and splits to selected horizon
        shell: bash
        run: |
          split_args=()
          if [[ "$LEAKAGE_STRESS_TEST" == "true" || "$PHASE2_EVALUATION" == "true" ]]; then
            split_args+=(--train-window-days 504 --validation-window-days 63 --step-days 63)
          fi
          python -m scripts.build_forward_return_labels \
            --horizon "$TARGET_HORIZON_DAYS"
          python -m scripts.augment_research_targets \
            --target-horizon-days "$TARGET_HORIZON_DAYS"
          python -m scripts.build_walk_forward_splits \
            --target-horizon-days "$TARGET_HORIZON_DAYS" \
            --universe-membership data/processed/universe_membership.parquet \
            --purge-days "$TARGET_HORIZON_DAYS" \
            --embargo-days "$TARGET_HORIZON_DAYS" \
            "${split_args[@]}"

      - name: Audit feature quality and predictive stability
        if: env.CLASSICAL_SWEEP != 'true' && (env.LEAKAGE_STRESS_TEST != 'true' || env.PHASE2_EVALUATION == 'true')
        run: >-
          python -m scripts.audit_feature_quality
          --target-horizon-days "$TARGET_HORIZON_DAYS"
          --max-rows-per-date 64
          --membership data/processed/universe_membership.parquet
          --output-dir reports/weekly_retraining/feature_audit

      - name: Retrain selected models
        if: env.FULL_EXPERIMENT != 'true'
        shell: bash
        run: |
          if [[ "$PHASE2_EVALUATION" == "true" ]]; then
            models=(
              tuned_gradient_boosting_regressor xgboost_ranker
              residualized_xgboost_ranker huber_regression
              residualized_huber_regression momentum_rank sector_neutral_rank
              random_rank
            )
          elif [[ "$LEAKAGE_STRESS_TEST" == "true" ]]; then
            models=(
              logistic_regression random_forest gradient_boosting
              random_forest_regressor gradient_boosting_regressor
              tuned_gradient_boosting_regressor momentum_rank random_rank
              sector_neutral_rank
            )
          elif [[ "$CLASSICAL_SWEEP" == "true" ]]; then
            models=(
              logistic_regression elastic_net ridge_regression huber_regression
              random_forest random_forest_regressor gradient_boosting
              gradient_boosting_regressor tuned_gradient_boosting_regressor
              vol_normalized_gradient_boosting_regressor xgboost_ranker
              residualized_xgboost_ranker residualized_huber_regression
              momentum_rank random_rank sector_neutral_rank
            )
          else
            models=("$BASELINE_MODEL")
          fi
          if [[ "$RUN_QML" == "true" && "$CLASSICAL_SWEEP" != "true" && "$LEAKAGE_STRESS_TEST" != "true" ]]; then
            models+=(vqc)
          fi
          python -m scripts.run_walk_forward_backtest \
            --models "${models[@]}" \
            --output-dir reports/weekly_retraining \
            --universe-membership data/processed/universe_membership.parquet \
            --target-horizon-days "$TARGET_HORIZON_DAYS" \
            $([[ "$LEAKAGE_STRESS_TEST" == "true" || "$PHASE2_EVALUATION" == "true" ]] && echo "--feature-lag-days 1 --permutation-iterations 2000 --permutation-block-days $TARGET_HORIZON_DAYS") \
            --disable-mlflow

      - name: Run full classical and tuned quantum experiment
        if: env.FULL_EXPERIMENT == 'true'
        shell: bash
        run: |
          if [[ ! "$QUANTUM_SAMPLE_ROWS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid quantum sample::quantum_sample_rows must be positive."
            exit 1
          fi
          if [[ ! "$QUANTUM_ITERATIONS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid quantum iterations::quantum_iterations must be positive."
            exit 1
          fi
          python -m scripts.run_walk_forward_backtest \
            --models \
              logistic_regression elastic_net ridge_regression huber_regression \
              random_forest random_forest_regressor gradient_boosting \
              gradient_boosting_regressor tuned_gradient_boosting_regressor \
              vol_normalized_gradient_boosting_regressor xgboost_ranker \
              residualized_xgboost_ranker residualized_huber_regression \
              momentum_rank random_rank sector_neutral_rank \
            --output-dir reports/weekly_retraining/classical_full \
            --universe-membership data/processed/universe_membership.parquet \
            --transaction-cost-bps 10 \
            --target-horizon-days "$TARGET_HORIZON_DAYS" \
            --disable-mlflow
          python scripts/compare_qml_models.py \
            --classical-selection \
              reports/weekly_retraining/classical_full/selection_diagnostics.parquet \
            --output-dir reports/weekly_retraining/qml_tuned_full \
            --universe-membership data/processed/universe_membership.parquet \
            --train-rows "$QUANTUM_SAMPLE_ROWS" \
            --validation-rows "$QUANTUM_SAMPLE_ROWS" \
            --iterations "$QUANTUM_ITERATIONS" \
            --target-horizon-days "$TARGET_HORIZON_DAYS" \
            --transaction-cost-bps 10
          python -m scripts.build_definitive_qml_comparison \
            --equal-dir reports/weekly_retraining/qml_tuned_full \
            --best-classical-dir reports/weekly_retraining/classical_full \
            --best-qml-dir reports/weekly_retraining/qml_tuned_full \
            --target-horizon-days "$TARGET_HORIZON_DAYS"

      - name: Write run summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Weekly model retraining"
            echo "- Baseline: \`$BASELINE_MODEL\`"
            echo "- QML enabled: \`$RUN_QML\`"
            echo "- Classical development sweep: \`$CLASSICAL_SWEEP\`"
            echo "- Leakage stress test: \`$LEAKAGE_STRESS_TEST\`"
            echo "- Frozen Phase 2 evaluation: \`$PHASE2_EVALUATION\`"
            echo "- Full feature audit: \`$([[ \"$CLASSICAL_SWEEP\" == \"true\" ]] && echo skipped || echo completed)\`"
            echo "- Full nested-tuning experiment: \`$FULL_EXPERIMENT\`"
            echo "- Reports are stored in the private R2 bucket under \`reports/runs/${GITHUB_RUN_ID}/\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize retraining failure
        if: failure()
        run: echo "::error title=Weekly retraining failed::Review the first failed step above. Confirm a verified private R2 snapshot exists and that feature inputs are complete."

      - name: Upload reports to private R2
        if: success()
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync \
            reports/weekly_retraining/ \
            "s3://${R2_BUCKET_NAME}/reports/runs/${GITHUB_RUN_ID}/" \
            --endpoint-url "$endpoint" \
            --only-show-errors
