name: Retrieve aggregate experiment report

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful weekly retraining run ID
        required: true
        type: string
      report_scope:
        description: Aggregate report layout to retrieve
        required: true
        default: definitive_private
        type: choice
        options:
          - definitive_private
          - qml_qualification

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --editable .

      - name: Download aggregate-only tables
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          REPORT_RUN_ID: ${{ inputs.run_id }}
          REPORT_SCOPE: ${{ inputs.report_scope }}
        run: |
          if [[ ! "$REPORT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid run ID::run_id must contain digits only."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p private-aggregate
          if [[ "$REPORT_SCOPE" == "qml_qualification" ]]; then
            mkdir -p private-aggregate/qml_validation
            aws s3 cp \
              "s3://${R2_BUCKET_NAME}/reports/runs/${REPORT_RUN_ID}/qml_validation/hardware_qualification.json" \
              private-aggregate/qml_validation/hardware_qualification.json \
              --endpoint-url "$endpoint" \
              --only-show-errors
          else
            aws s3 sync \
              "s3://${R2_BUCKET_NAME}/reports/runs/${REPORT_RUN_ID}/definitive_private/" \
              private-aggregate/ \
              --endpoint-url "$endpoint" \
              --only-show-errors
          fi

      - name: Render allowlisted aggregate report
        run: >-
          python -m scripts.render_private_aggregate_report
          --input-dir private-aggregate
          --output aggregate-report.md

      - name: Publish safe summary
        shell: bash
        run: cat aggregate-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe report
        uses: actions/upload-artifact@v6
        with:
          name: aggregate-report-${{ inputs.run_id }}
          path: aggregate-report.md
          if-no-files-found: error
          retention-days: 30
