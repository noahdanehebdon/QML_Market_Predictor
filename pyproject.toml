[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-qml-predictor"
version = "0.1.0"
description = "Market prediction research platform comparing classical ML and quantum machine learning models."
authors = [{ name = "Noah Hebdon" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.7",
    "xgboost>=3.1,<4",
    "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8.0",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
    "twine>=5,<7",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]
dashboard = [
    "streamlit>=1.36,<2",
]
tracking = [
    "mlflow-skinny>=3.11.1",
]

[project.scripts]
ingest-prices = "market_qml.cli:ingest_prices"
ingest-macro = "market_qml.cli:ingest_macro"
ingest-sec = "market_qml.cli:ingest_sec"
build-features = "market_qml.cli:build_features"
train = "market_qml.cli:train"
backtest = "market_qml.cli:backtest"
report = "market_qml.cli:report"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["market_qml*", "scripts*"]
exclude = ["artifacts*", "build*", "data*", "dist*", "mlruns*", "reports*", "tests*"]

[tool.setuptools.package-data]
market_qml = ["default_cli.yaml"]

[project.urls]
Repository = "https://github.com/noahdanehebdon/QML_Market_Predictor"
Documentation = "https://github.com/noahdanehebdon/QML_Market_Predictor/tree/main/docs"
Issues = "https://github.com/noahdanehebdon/QML_Market_Predictor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["market_qml"]

[tool.coverage.report]
fail_under = 82
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["artifacts", "data", "mlruns", "reports"]

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "PIE", "RUF", "UP"]
ignore = [
    # Existing callbacks intentionally capture loop state; fix separately with tests.
    "B023",
    # FastAPI-style dependency defaults are part of those callable interfaces.
    "B008",
    # Preserve compatibility where zip inputs are not guaranteed to be equal length.
    "B905",
    # List concatenation is clearer where pandas expects concrete column lists.
    "RUF005",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
