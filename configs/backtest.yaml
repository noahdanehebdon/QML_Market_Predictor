backtest:
  benchmark: "SPY"
  return_horizon_days: 5
  rebalance_frequency: 5
  trading_days_per_year: 252
  initial_capital: 100000
  transaction_cost_bps: 10
  long_short:
    enabled: false

walk_forward:
  train_window_days: 756
  validation_window_days: 126
  # Final 12-month period is excluded from routine research and tuning.
  locked_test_days: 252
  embargo_days: 5
  # Remove training labels whose five-day outcome overlaps validation.
  purge_days: 5
  inner_folds: 3
  bootstrap_block_days: 20
  practical_auc_threshold: 0.02
