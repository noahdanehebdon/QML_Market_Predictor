# Independent limits enforced immediately before any Alpaca paper request.
paper_execution:
  strategy_id: "market-qml"
  max_intent_age_minutes: 30
  max_order_count: 20
  max_gross_exposure: 0.90
  max_position_weight: 0.20
  max_turnover: 1.0
  minimum_order_notional: 10.0
  cash_reserve_weight: 0.10
  max_equity_drift_fraction: 0.02
  max_daily_loss_fraction: 0.02
  limit_price_buffer_bps: 25.0
  cancel_after_minutes: 15
