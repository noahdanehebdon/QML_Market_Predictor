calibration:
  method: platt_logistic
  minimum_history_rows: 20
  history: prior_outer_folds_only
ensembles:
  methods: [simple_average, rank_average, constrained_stack]
  nonnegative_weights: true
  weights_sum_to_one: true
  turnover_penalty: 0.01
  fold_instability_penalty: 0.10
regimes:
  minimum_rows: 100
evaluation:
  constituent_removal: true
  retain_failure_to_improve: true
